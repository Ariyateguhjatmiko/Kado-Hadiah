<!DOCTYPE html>
<html>
<head>
  <title>Upload Foto ke Cloudinary</title>
</head>
<body>
  <h1>Ambil Foto & Upload ke Cloudinary</h1>

  <input type="file" id="fotoInput" accept="image/*">
  <br><br>
  <button onclick="uploadFoto()">Upload Foto</button>

  <p id="status"></p>
  <img id="preview" width="300" style="display:none;">

  <script>
    async function uploadFoto() {
      const fileInput = document.getElementById('fotoInput');
      const file = fileInput.files[0];
      if (!file) {
        alert("Pilih file dulu, ya!");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", "foto_auto"); // Ganti dengan preset kamu

      document.getElementById('status').innerText = "Mengupload...";

      const response = await fetch("https://api.cloudinary.com/v1_1/NAMA_CLOUD_KAMU/image/upload", {
        method: "POST",
        body: formData
      });

      const data = await response.json();
      document.getElementById('status').innerText = "Upload selesai!";

      const imageUrl = data.secure_url;
      document.getElementById('preview').src = imageUrl;
      document.getElementById('preview').style.display = "block";

      console.log("Link foto:", imageUrl);

      // Simpan link ini ke GitHub atau file JSON di sini kalau mau
    }
  </script>
</body>
</html>
