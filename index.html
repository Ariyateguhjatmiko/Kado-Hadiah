<!DOCTYPE html>
<html>
<head>
  <title>Kamera Depan & Upload ke Cloudinary</title>
</head>
<body>
  <h2>Kamera Depan</h2>
  <video id="video" autoplay playsinline width="300"></video><br>
  <button onclick="ambilFoto()">Ambil Foto</button>
  <p id="status"></p>
  <img id="preview" style="display:none" width="300">
  
  <script>
    const video = document.getElementById('video');
    const preview = document.getElementById('preview');

    // Aktifkan kamera depan
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    }).then((stream) => {
      video.srcObject = stream;
    }).catch((err) => {
      alert("Gagal membuka kamera: " + err);
    });

    async function ambilFoto() {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataURL = canvas.toDataURL('image/jpeg');
      
      // Tampilkan preview
      preview.src = dataURL;
      preview.style.display = 'block';

      // Upload ke Cloudinary
      document.getElementById('status').innerText = "Mengupload ke Cloudinary...";
      const formData = new FormData();
      formData.append("file", dataURL);
      formData.append("upload_preset", "foto_auto"); // ganti sesuai punya kamu

      const res = await fetch("https://api.cloudinary.com/v1_1/Foto-auto/image/upload", {
        method: "POST",
        body: formData
      });
      const data = await res.json();
      document.getElementById('status').innerText = "Berhasil! Link: " + data.secure_url;
      console.log("Link Gambar:", data.secure_url);
    }
  </script>
</body>
</html>
